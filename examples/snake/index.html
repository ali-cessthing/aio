<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05060d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TITAN Snake</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #05060d; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: grid; place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 30%, #0d1230 0%, #05060d 70%);
    }
    /* El lienzo interno es 720×1280 (9:16) y se escala para llenar la pantalla. */
    #game {
      display: block; touch-action: none;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      box-shadow: 0 0 60px rgba(61, 255, 181, 0.12);
    }
    @media (min-width: 700px) { #game { border-radius: 18px; } }
    #status {
      position: fixed; inset: auto 1rem 1rem 1rem; padding: .8rem 1rem; border-radius: .6rem;
      background: #1a0b16; color: #ffb3c4; font: 14px ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <canvas id="game" width="720" height="1280" aria-label="TITAN Snake, juego dibujado por TITAN en WebAssembly"></canvas>
  <p id="status">Cargando TITAN…</p>
  <script>
    // Evita que flechas/espacio desplacen la página mientras se juega.
    addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    }, { passive: false });
  </script>
  <script type="module" src="./host.js"></script>
</body>
</html>
